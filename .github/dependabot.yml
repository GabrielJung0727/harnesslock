version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # commander 15 requires Node >= 22.12; harnesslock supports Node >= 20.
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native port) drops the JS compiler API that tsup's .d.ts build needs.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
