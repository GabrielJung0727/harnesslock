name: Release

# Publishes to npm when a `v*` tag is pushed, using npm Trusted Publishing (OIDC):
# no npm token is stored in this repository. Configure it once on npmjs.com under
# harnesslock → Settings → Trusted Publisher (GitHub Actions, workflow: release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted Publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "harnesslock@$version" version >/dev/null 2>&1; then
            echo "harnesslock@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (typecheck, test and build run in prepublishOnly)
        if: steps.version.outputs.skip != 'true'
        run: npm publish
